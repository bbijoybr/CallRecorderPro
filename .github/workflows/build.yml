
name: Build CallRecorderPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/java/com/callrecorderpro
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CallRecorderPro"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.callrecorderpro"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.callrecorderpro"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 2
                  versionName = "1.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1565C0</item>
                  <item name="android:statusBarColor">#0D47A1</item>
                  <item name="android:navigationBarColor">#0D47A1</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="CallRecorderPro"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CallRecordingService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/callrecorderpro/MainActivity.kt <<'EOF'
          package com.callrecorderpro

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var recordings: LinearLayout
              private var player: MediaPlayer? = null
              private val permissionRequest = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createScreen()
                  requestPermissionsIfNeeded()
              }

              private fun createScreen() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }

                  root.addView(TextView(this).apply {
                      text = "CallRecorderPro"
                      textSize = 27f
                      gravity = Gravity.CENTER
                  })

                  root.addView(TextView(this).apply {
                      text = "For call recording, turn ON speakerphone after answering. " +
                          "Android may block call audio from third-party apps, so both voices " +
                          "cannot be guaranteed."
                      textSize = 15f
                      setPadding(0, 16, 0, 16)
                  })

                  root.addView(Button(this).apply {
                      text = "Enable call monitoring"
                      setOnClickListener {
                          if (!hasPermissions()) {
                              requestPermissionsIfNeeded()
                              return@setOnClickListener
                          }
                          try {
                              val intent = Intent(
                                  this@MainActivity,
                                  CallRecordingService::class.java
                              ).setAction(CallRecordingService.START_MONITORING)

                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                                  startForegroundService(intent)
                              } else {
                                  startService(intent)
                              }
                              status.text = "Monitoring enabled. Turn speakerphone ON during calls."
                          } catch (e: Exception) {
                              status.text = "Could not start: ${e.message}"
                          }
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Stop monitoring"
                      setOnClickListener {
                          stopService(
                              Intent(this@MainActivity, CallRecordingService::class.java)
                          )
                          status.text = "Monitoring stopped."
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Refresh recordings"
                      setOnClickListener { loadRecordings() }
                  })

                  status = TextView(this).apply {
                      text = "Grant permissions, then enable monitoring."
                      textSize = 14f
                      setPadding(0, 12, 0, 12)
                  }
                  root.addView(status)

                  root.addView(TextView(this).apply {
                      text = "Recordings — Music/CallRecorder"
                      textSize = 19f
                  })

                  recordings = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }

                  val scroll = ScrollView(this)
                  scroll.addView(recordings)
                  root.addView(scroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ))

                  setContentView(root)
                  loadRecordings()
              }

              private fun hasPermissions(): Boolean {
                  val required = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_PHONE_STATE
                  )
                  if (Build.VERSION.SDK_INT >= 33) {
                      required.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  return required.all {
                      checkSelfPermission(it) == PackageManager.PERMISSION_GRANTED
                  }
              }

              private fun requestPermissionsIfNeeded() {
                  val required = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_PHONE_STATE
                  )
                  if (Build.VERSION.SDK_INT >= 33) {
                      required.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val missing = required.filter {
                      checkSelfPermission(it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      requestPermissions(missing.toTypedArray(), permissionRequest)
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == permissionRequest) {
                      status.text = if (hasPermissions()) {
                          "Permissions granted. Enable call monitoring."
                      } else {
                          "Required permissions were not granted."
                      }
                  }
              }

              private fun loadRecordings() {
                  if (!::recordings.isInitialized) return
                  recordings.removeAllViews()

                  val collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.DISPLAY_NAME
                  )

                  try {
                      contentResolver.query(
                          collection,
                          projection,
                          "${MediaStore.Audio.Media.RELATIVE_PATH} = ?",
                          arrayOf("Music/CallRecorder/"),
                          "${MediaStore.Audio.Media.DATE_ADDED} DESC"
                      )?.use { cursor ->
                          if (cursor.count == 0) {
                              recordings.addView(TextView(this).apply {
                                  text = "No recordings found yet."
                                  setPadding(0, 12, 0, 12)
                              })
                          }

                          while (cursor.moveToNext()) {
                              val id = cursor.getLong(
                                  cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                              )
                              val name = cursor.getString(
                                  cursor.getColumnIndexOrThrow(
                                      MediaStore.Audio.Media.DISPLAY_NAME
                                  )
                              ) ?: "Recording"

                              val uri = Uri.withAppendedPath(collection, id.toString())

                              recordings.addView(TextView(this).apply {
                                  text = name
                                  textSize = 15f
                                  setPadding(0, 12, 0, 4)
                              })

                              recordings.addView(Button(this).apply {
                                  text = "Play"
                                  setOnClickListener { play(uri) }
                              })
                          }
                      }
                  } catch (e: Exception) {
                      recordings.addView(TextView(this).apply {
                          text = "Could not load recordings: ${e.message}"
                      })
                  }
              }

              private fun play(uri: Uri) {
                  try {
                      player?.release()
                      player = MediaPlayer().apply {
                          setDataSource(this@MainActivity, uri)
                          setOnCompletionListener {
                              it.release()
                              if (player === it) player = null
                          }
                          prepare()
                          start()
                      }
                  } catch (e: Exception) {
                      player?.release()
                      player = null
                      Toast.makeText(
                          this, "Playback failed: ${e.message}", Toast.LENGTH_LONG
                      ).show()
                  }
              }

              override fun onResume() {
                  super.onResume()
                  if (::recordings.isInitialized) loadRecordings()
              }

              override fun onDestroy() {
                  player?.release()
                  player = null
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/callrecorderpro/CallRecordingService.kt <<'EOF'
          package com.callrecorderpro

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.os.Build
          import android.os.IBinder
          import android.provider.MediaStore
          import android.telephony.PhoneStateListener
          import android.telephony.TelephonyManager
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import kotlin.concurrent.thread

          class CallRecordingService : Service() {
              companion object {
                  const val START_MONITORING = "com.callrecorderpro.START_MONITORING"
                  private const val CHANNEL = "call_recorder_channel"
                  private const val NOTIFICATION_ID = 2101
                  private const val RATE = 16000
              }

              private var telephony: TelephonyManager? = null
              private var listener: PhoneStateListener? = null
              private var recorder: AudioRecord? = null
              @Volatile private var recording = false
              @Volatile private var monitoring = false
              private var worker: Thread? = null
              private var tempFile: File? = null

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startForeground(
                      NOTIFICATION_ID,
                      notification("Waiting for a phone call")
                  )
                  startMonitoring()
                  return START_NOT_STICKY
              }

              @Suppress("DEPRECATION")
              private fun startMonitoring() {
                  if (monitoring) return

                  try {
                      telephony = getSystemService(TELEPHONY_SERVICE) as TelephonyManager
                      listener = object : PhoneStateListener() {
                          override fun onCallStateChanged(state: Int, phoneNumber: String?) {
                              when (state) {
                                  TelephonyManager.CALL_STATE_RINGING -> {
                                      updateNotification(
                                          "Incoming call. Answer and turn speakerphone ON."
                                      )
                                  }
                                  TelephonyManager.CALL_STATE_OFFHOOK -> {
                                      updateNotification(
                                          "Call active. Turn speakerphone ON for best results."
                                      )
                                      startRecording()
                                  }
                                  TelephonyManager.CALL_STATE_IDLE -> {
                                      stopRecording()
                                      updateNotification("Call ended. Waiting for another call.")
                                  }
                              }
                          }
                      }
                      telephony?.listen(listener, PhoneStateListener.LISTEN_CALL_STATE)
                      monitoring = true
                  } catch (e: Exception) {
                      updateNotification("Monitoring failed: ${e.message}")
                  }
              }

              private fun startRecording() {
                  if (recording) return

                  try {
                      val minimum = AudioRecord.getMinBufferSize(
                          RATE,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT
                      )
                      if (minimum <= 0) {
                          updateNotification("Microphone is unavailable")
                          return
                      }

                      val audio = AudioRecord(
                          MediaRecorder.AudioSource.MIC,
                          RATE,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          maxOf(minimum * 2, 8192)
                      )

                      if (audio.state != AudioRecord.STATE_INITIALIZED) {
                          audio.release()
                          updateNotification("Could not initialize microphone")
                          return
                      }

                      val stamp = SimpleDateFormat(
                          "yyyyMMdd_HHmmss", Locale.US
                      ).format(Date())

                      val file = File(cacheDir, "CallRecorderPro_$stamp.pcm")
                      recorder = audio
                      tempFile = file
                      audio.startRecording()
                      recording = true

                      worker = thread(name = "CallRecorderAudio") {
                          try {
                              FileOutputStream(file).use { output ->
                                  val buffer = ByteArray(maxOf(minimum, 4096))
                                  while (recording) {
                                      val count = audio.read(buffer, 0, buffer.size)
                                      if (count > 0) output.write(buffer, 0, count)
                                      else if (count < 0) break
                                  }
                              }
                          } catch (_: Exception) {
                              // Finalize any usable audio captured before an error.
                          }
                      }

                      updateNotification(
                          "Recording microphone audio. Speakerphone is recommended."
                      )
                  } catch (e: Exception) {
                      recording = false
                      updateNotification("Recording could not start: ${e.message}")
                  }
              }

              private fun stopRecording() {
                  if (!recording) return
                  recording = false

                  try { recorder?.stop() } catch (_: Exception) {}
                  try { worker?.join(2000) } catch (_: InterruptedException) {}
                  try { recorder?.release() } catch (_: Exception) {}

                  recorder = null
                  worker = null

                  val file = tempFile
                  tempFile = null

                  if (file != null && file.exists() && file.length() > 0L) {
                      try {
                          saveWav(file)
                          updateNotification("Saved to Music/CallRecorder")
                      } catch (e: Exception) {
                          updateNotification("Could not save audio: ${e.message}")
                      } finally {
                          file.delete()
                      }
                  } else {
                      file?.delete()
                      updateNotification("No audio captured. Check microphone access.")
                  }
              }

              private fun saveWav(pcm: File) {
                  val stamp = SimpleDateFormat(
                      "yyyy-MM-dd_HH-mm-ss", Locale.US
                  ).format(Date())

                  val values = ContentValues().apply {
                      put(MediaStore.Audio.Media.DISPLAY_NAME, "Call_$stamp.wav")
                      put(MediaStore.Audio.Media.MIME_TYPE, "audio/wav")
                      if (Build.VERSION.SDK_INT >= 29) {
                          put(MediaStore.Audio.Media.RELATIVE_PATH, "Music/CallRecorder/")
                          put(MediaStore.Audio.Media.IS_PENDING, 1)
                      }
                  }

                  val uri = contentResolver.insert(
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values
                  ) ?: throw IllegalStateException("Could not create audio file")

                  try {
                      contentResolver.openOutputStream(uri)?.use { output ->
                          val dataSize = pcm.length().coerceAtMost(
                              Int.MAX_VALUE.toLong() - 44
                          ).toInt()
                          output.write(wavHeader(dataSize))
                          FileInputStream(pcm).use { input -> input.copyTo(output) }
                      } ?: throw IllegalStateException("Could not open audio output")

                      if (Build.VERSION.SDK_INT >= 29) {
                          val done = ContentValues().apply {
                              put(MediaStore.Audio.Media.IS_PENDING, 0)
                          }
                          contentResolver.update(uri, done, null, null)
                      }
                  } catch (e: Exception) {
                      contentResolver.delete(uri, null, null)
                      throw e
                  }
              }

              private fun wavHeader(size: Int): ByteArray {
                  val h = ByteArray(44)
                  fun ascii(offset: Int, text: String) {
                      text.toByteArray(Charsets.US_ASCII).copyInto(h, offset)
                  }
                  fun int32(offset: Int, value: Int) {
                      for (i in 0..3) h[offset + i] =
                          (value ushr (8 * i)).toByte()
                  }
                  fun int16(offset: Int, value: Int) {
                      h[offset] = (value and 255).toByte()
                      h[offset + 1] = ((value ushr 8) and 255).toByte()
                  }

                  ascii(0, "RIFF")
                  int32(4, size + 36)
                  ascii(8, "WAVE")
                  ascii(12, "fmt ")
                  int32(16, 16)
                  int16(20, 1)
                  int16(22, 1)
                  int32(24, RATE)
                  int32(28, RATE * 2)
                  int16(32, 2)
                  int16(34, 16)
                  ascii(36, "data")
                  int32(40, size)
                  return h
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL,
                          "CallRecorderPro monitoring",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }
              }

              private fun notification(message: String): Notification {
                  val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }

                  return builder
                      .setContentTitle("CallRecorderPro")
                      .setContentText(message)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(true)
                      .build()
              }

              private fun updateNotification(message: String) {
                  try {
                      getSystemService(NotificationManager::class.java).notify(
                          NOTIFICATION_ID, notification(message)
                      )
                  } catch (_: Exception) {}
              }

              @Suppress("DEPRECATION")
              override fun onDestroy() {
                  stopRecording()
                  try {
                      telephony?.listen(listener, PhoneStateListener.LISTEN_NONE)
                  } catch (_: Exception) {}
                  monitoring = false
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build APK
        run: |
          gradle --version
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorderPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
