
name: Build CallRecorder APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install SDK packages
        run: |
          sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/callrecorder

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CallRecorder"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.callrecorder"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.callrecorder"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Call Recorder"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/callrecorder/MainActivity.kt <<'EOF'
          package com.example.callrecorder

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(28, 28, 28, 28)
                  }

                  val info = TextView(this).apply {
                      text = "Call Recorder\n\n" +
                          "1. Allow microphone permission.\n" +
                          "2. Allow display over other apps.\n" +
                          "3. Return and press Start.\n" +
                          "4. Tap the floating button to record or stop.\n\n" +
                          "Microphone recording only. The other caller's " +
                          "voice is not guaranteed to be captured."
                      textSize = 17f
                  }

                  val start = Button(this).apply {
                      text = "Start Floating Recorder"
                      setOnClickListener { enableRecorder() }
                  }

                  layout.addView(info)
                  layout.addView(start)
                  setContentView(layout)
              }

              private fun enableRecorder() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          arrayOf(Manifest.permission.RECORD_AUDIO), 10
                      )
                      return
                  }

                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                      return
                  }

                  startForegroundService(
                      Intent(this, FloatingService::class.java)
                  )
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults
                  )
                  if (requestCode == 10 &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      enableRecorder()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/callrecorder/FloatingService.kt <<'EOF'
          package com.example.callrecorder

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.media.audiofx.AcousticEchoCanceler
          import android.media.audiofx.NoiseSuppressor
          import android.os.Environment
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class FloatingService : Service() {
              private var wm: WindowManager? = null
              private var button: TextView? = null
              private var audio: AudioRecord? = null
              private var worker: Thread? = null

              @Volatile private var recording = false
              private var file: File? = null
              private var ns: NoiseSuppressor? = null
              private var aec: AcousticEchoCanceler? = null

              override fun onCreate() {
                  super.onCreate()

                  val manager =
                      getSystemService(NotificationManager::class.java)

                  manager.createNotificationChannel(
                      NotificationChannel(
                          "recorder",
                          "Call Recorder",
                          NotificationManager.IMPORTANCE_LOW
                      )
                  )

                  val notification = Notification.Builder(this, "recorder")
                      .setContentTitle("Call Recorder")
                      .setContentText("Floating recorder is ready")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()

                  startForeground(
                      1,
                      notification,
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  )

                  showButton()
              }

              private fun showButton() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager

                  val view = TextView(this).apply {
                      text = "● REC"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(180, 30, 30))
                      gravity = Gravity.CENTER
                      setPadding(24, 18, 24, 18)

                      setOnClickListener {
                          if (recording) stopRecording()
                          else startRecording()
                      }
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = 20
                      y = 250
                  }

                  button = view
                  wm?.addView(view, params)
              }

              private fun startRecording() {
                  if (recording) return

                  try {
                      val rate = 16000
                      val min = AudioRecord.getMinBufferSize(
                          rate,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT
                      )
                      if (min <= 0) return

                      val rec = AudioRecord(
                          MediaRecorder.AudioSource.MIC,
                          rate,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          min * 2
                      )

                      if (rec.state != AudioRecord.STATE_INITIALIZED) {
                          rec.release()
                          return
                      }

                      audio = rec

                      if (NoiseSuppressor.isAvailable()) {
                          ns = NoiseSuppressor.create(rec.audioSessionId)
                          ns?.enabled = true
                      }

                      if (AcousticEchoCanceler.isAvailable()) {
                          aec = AcousticEchoCanceler.create(rec.audioSessionId)
                          aec?.enabled = true
                      }

                      val dir = File(
                          getExternalFilesDir(Environment.DIRECTORY_MUSIC),
                          "CallRecorder"
                      )
                      dir.mkdirs()

                      file = File(
                          dir,
                          "Recording_${System.currentTimeMillis()}.wav"
                      )

                      recording = true
                      button?.text = "■ STOP"
                      rec.startRecording()

                      worker = Thread {
                          val output = file ?: return@Thread

                          output.outputStream().use { stream ->
                              stream.write(ByteArray(44))
                              val buffer = ByteArray(min)

                              while (recording) {
                                  val n = rec.read(
                                      buffer, 0, buffer.size,
                                      AudioRecord.READ_BLOCKING
                                  )
                                  if (n > 0) stream.write(buffer, 0, n)
                              }
                          }
                      }

                      worker?.start()
                  } catch (_: Exception) {
                      recording = false
                      button?.text = "● REC"
                      try { audio?.release() } catch (_: Exception) {}
                      audio = null
                  }
              }

              private fun stopRecording() {
                  if (!recording) return

                  recording = false
                  try { audio?.stop() } catch (_: Exception) {}
                  try { worker?.join(3000) } catch (_: Exception) {}
                  try { audio?.release() } catch (_: Exception) {}
                  audio = null

                  try { ns?.release() } catch (_: Exception) {}
                  ns = null
                  try { aec?.release() } catch (_: Exception) {}
                  aec = null

                  file?.let { f ->
                      try {
                          val size = (f.length() - 44)
                              .toInt().coerceAtLeast(0)

                          RandomAccessFile(f, "rw").use { r ->
                              r.seek(0)
                              r.writeBytes("RIFF")
                              putInt(r, size + 36)
                              r.writeBytes("WAVEfmt ")
                              putInt(r, 16)
                              putShort(r, 1)
                              putShort(r, 1)
                              putInt(r, 16000)
                              putInt(r, 32000)
                              putShort(r, 2)
                              putShort(r, 16)
                              r.writeBytes("data")
                              putInt(r, size)
                          }
                      } catch (_: Exception) {}
                  }

                  button?.text = "● REC"
              }

              private fun putInt(r: RandomAccessFile, n: Int) {
                  r.write(
                      ByteBuffer.allocate(4)
                          .order(ByteOrder.LITTLE_ENDIAN)
                          .putInt(n).array()
                  )
              }

              private fun putShort(r: RandomAccessFile, n: Int) {
                  r.write(
                      ByteBuffer.allocate(2)
                          .order(ByteOrder.LITTLE_ENDIAN)
                          .putShort(n.toShort()).array()
                  )
              }

              override fun onStartCommand(
                  intent: Intent?, flags: Int, startId: Int
              ): Int = START_NOT_STICKY

              override fun onDestroy() {
                  if (recording) stopRecording()
                  try {
                      button?.let { wm?.removeView(it) }
                  } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
