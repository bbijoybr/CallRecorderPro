

name: Build CallRecorder APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/callrecorder

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CallRecorder"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.callrecorder"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.callrecorder"
                  minSdk = 30
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Call Recorder"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/callrecorder/MainActivity.kt <<'EOF'
          package com.example.callrecorder

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.Manifest
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(32, 32, 32, 32)
                  }

                  val info = TextView(this).apply {
                      text = "Call Recorder\\n\\n1. Allow microphone access.\\n2. Allow display over other apps.\\n3. Start the floating button.\\n4. Tap it to start or stop recording.\\n\\nOnly microphone audio is recorded; the other caller may not be captured."
                      textSize = 17f
                      setTextColor(Color.BLACK)
                  }

                  val button = Button(this).apply {
                      text = "Enable Floating Record Button"
                      setOnClickListener { enableRecorder() }
                  }

                  layout.addView(info)
                  layout.addView(button)
                  setContentView(layout)
              }

              private fun enableRecorder() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          arrayOf(Manifest.permission.RECORD_AUDIO), 10
                      )
                      return
                  }

                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                      return
                  }

                  startForegroundService(
                      Intent(this, FloatingService::class.java)
                  )
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults
                  )
                  if (requestCode == 10 &&
                      grantResults.isNotEmpty() &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      enableRecorder()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/callrecorder/FloatingService.kt <<'EOF'
          package com.example.callrecorder

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.media.*
          import android.media.audiofx.AcousticEchoCanceler
          import android.media.audiofx.NoiseSuppressor
          import android.os.*
          import android.view.*
          import android.widget.TextView
          import java.io.File
          import java.io.RandomAccessFile
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          class FloatingService : Service() {
              private var windowManager: WindowManager? = null
              private var floatingView: TextView? = null
              private var recorder: AudioRecord? = null
              private var recordingThread: Thread? = null
              private var isRecording = false
              private var audioFile: File? = null
              private var noiseSuppressor: NoiseSuppressor? = null
              private var echoCanceler: AcousticEchoCanceler? = null

              override fun onCreate() {
                  super.onCreate()
                  val channel = NotificationChannel(
                      "recorder_channel",
                      "Call Recorder",
                      NotificationManager.IMPORTANCE_LOW
                  )
                  getSystemService(NotificationManager::class.java)
                      .createNotificationChannel(channel)

                  val notification = Notification.Builder(this, "recorder_channel")
                      .setContentTitle("Call Recorder is ready")
                      .setContentText("Tap the floating button to record or stop.")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .build()

                  startForeground(
                      1, notification,
                      ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                  )
                  showFloatingButton()
              }

              private fun showFloatingButton() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  val button = TextView(this).apply {
                      text = "● REC"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setBackgroundColor(Color.rgb(190, 35, 35))
                      gravity = Gravity.CENTER
                      setPadding(24, 18, 24, 18)
                      setOnClickListener {
                          if (isRecording) stopRecording() else startRecording()
                      }
                      setOnTouchListener(object : View.OnTouchListener {
                          var startX = 0
                          var startY = 0
                          var touchX = 0f
                          var touchY = 0f

                          override fun onTouch(v: View, e: MotionEvent): Boolean {
                              val params = v.layoutParams as WindowManager.LayoutParams
                              when (e.action) {
                                  MotionEvent.ACTION_DOWN -> {
                                      startX = params.x
                                      startY = params.y
                                      touchX = e.rawX
                                      touchY = e.rawY
                                      return false
                                  }
                                  MotionEvent.ACTION_MOVE -> {
                                      params.x = startX + (e.rawX - touchX).toInt()
                                      params.y = startY + (e.rawY - touchY).toInt()
                                      windowManager?.updateViewLayout(v, params)
                                      return true
                                  }
                              }
                              return false
                          }
                      })
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.RIGHT or Gravity.CENTER_VERTICAL
                      x = 20
                  }

                  floatingView = button
                  windowManager?.addView(button, params)
              }

              private fun startRecording() {
                  try {
                      val rate = 16000
                      val minBuffer = AudioRecord.getMinBufferSize(
                          rate,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT
                      )
                      if (minBuffer <= 0) return

                      val audio = AudioRecord(
                          MediaRecorder.AudioSource.MIC,
                          rate,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          minBuffer * 2
                      )
                      if (audio.state != AudioRecord.STATE_INITIALIZED) {
                          audio.release()
                          return
                      }

                      recorder = audio
                      if (NoiseSuppressor.isAvailable()) {
                          noiseSuppressor = NoiseSuppressor.create(audio.audioSessionId)
                          noiseSuppressor?.enabled = true
                      }
                      if (AcousticEchoCanceler.isAvailable()) {
                          echoCanceler = AcousticEchoCanceler.create(audio.audioSessionId)
                          echoCanceler?.enabled = true
                      }

                      val dir = File(
                          getExternalFilesDir(Environment.DIRECTORY_MUSIC),
                          "CallRecorder"
                      )
                      dir.mkdirs()
                      audioFile = File(dir, "Recording_${System.currentTimeMillis()}.wav")

                      isRecording = true
                      floatingView?.text = "■ STOP"
                      audio.startRecording()

                      recordingThread = Thread {
                          val file = audioFile ?: return@Thread
                          file.outputStream().use { out ->
                              out.write(ByteArray(44))
                              val buffer = ByteArray(minBuffer)
                              while (isRecording) {
                                  val count = audio.read(
                                      buffer, 0, buffer.size,
                                      AudioRecord.READ_BLOCKING
                                  )
                                  if (count > 0) out.write(buffer, 0, count)
                              }
                          }
                      }.also { it.start() }
                  } catch (_: Exception) {
                      isRecording = false
                      floatingView?.text = "● REC"
                  }
              }

              private fun stopRecording() {
                  isRecording = false
                  try { recorder?.stop() } catch (_: Exception) {}
                  try { recordingThread?.join(2000) } catch (_: Exception) {}
                  recorder?.release()
                  recorder = null

                  noiseSuppressor?.release()
                  noiseSuppressor = null
                  echoCanceler?.release()
                  echoCanceler = null

                  audioFile?.let { file ->
                      try {
                          val dataSize = (file.length() - 44).toInt()
                          RandomAccessFile(file, "rw").use { raf ->
                              raf.seek(0)
                              raf.writeBytes("RIFF")
                              writeInt(raf, dataSize + 36)
                              raf.writeBytes("WAVE")
                              raf.writeBytes("fmt ")
                              writeInt(raf, 16)
                              writeShort(raf, 1)
                              writeShort(raf, 1)
                              writeInt(raf, 16000)
                              writeInt(raf, 32000)
                              writeShort(raf, 2)
                              writeShort(raf, 16)
                              raf.writeBytes("data")
                              writeInt(raf, dataSize)
                          }
                      } catch (_: Exception) {}
                  }

                  floatingView?.text = "● REC"
              }

              private fun writeInt(raf: RandomAccessFile, value: Int) {
                  val b = ByteBuffer.allocate(4).order(ByteOrder.LITTLE_ENDIAN)
                  b.putInt(value)
                  raf.write(b.array())
              }

              private fun writeShort(raf: RandomAccessFile, value: Int) {
                  val b = ByteBuffer.allocate(2).order(ByteOrder.LITTLE_ENDIAN)
                  b.putShort(value.toShort())
                  raf.write(b.array())
              }

              override fun onStartCommand(
                  intent: Intent?, flags: Int, startId: Int
              ): Int = START_NOT_STICKY

              override fun onDestroy() {
                  if (isRecording) stopRecording()
                  try { floatingView?.let { windowManager?.removeView(it) } }
                  catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?) = null
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
