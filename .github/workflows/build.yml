
name: Build CallRecorderPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/callrecorder
          mkdir -p app/src/main/res/values
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CallRecorderPro"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.callrecorder"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.callrecorder"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1769AA</item>
                  <item name="android:statusBarColor">#124B7A</item>
                  <item name="android:navigationBarColor">#124B7A</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="CallRecorderPro"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/callrecorder/MainActivity.kt <<'EOF'
          package com.example.callrecorder

          import android.Manifest
          import android.app.Activity
          import android.content.*
          import android.content.pm.PackageManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var list: LinearLayout
              private var player: MediaPlayer? = null

              private val micPermission =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) checkOverlayAndStart()
                      else showStatus("মাইক্রোফোন অনুমতি ছাড়া রেকর্ডিং করা যাবে না।")
                  }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val message = intent?.getStringExtra(FloatingService.EXTRA_MESSAGE)
                      if (!message.isNullOrBlank()) showStatus(message)
                      refreshRecordings()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                  }

                  root.addView(TextView(this).apply {
                      text = "CallRecorderPro"
                      textSize = 26f
                      gravity = Gravity.CENTER
                  })

                  status = TextView(this).apply {
                      text = "রেকর্ডিং শুরু করতে নিচের বোতাম চাপুন।"
                      textSize = 16f
                      setPadding(0, 18, 0, 18)
                  }
                  root.addView(status)

                  root.addView(Button(this).apply {
                      text = "রেকর্ডিং শুরু করুন"
                      setOnClickListener { requestPermissionsAndStart() }
                  })

                  root.addView(Button(this).apply {
                      text = "রেকর্ডিং বন্ধ করুন"
                      setOnClickListener {
                          startService(
                              Intent(this@MainActivity, FloatingService::class.java)
                                  .setAction(FloatingService.ACTION_STOP)
                          )
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "রেকর্ডিং তালিকা রিফ্রেশ"
                      setOnClickListener { refreshRecordings() }
                  })

                  root.addView(TextView(this).apply {
                      text = "সংরক্ষিত রেকর্ডিং"
                      textSize = 20f
                      setPadding(0, 20, 0, 8)
                  })

                  val scroll = ScrollView(this)
                  list = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  scroll.addView(list)
                  root.addView(scroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ))

                  setContentView(root)

                  val filter = IntentFilter(FloatingService.ACTION_STATUS)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(receiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(receiver, filter)
                  }

                  refreshRecordings()
              }

              private fun requestPermissionsAndStart() {
                  if (ContextCompat.checkSelfPermission(
                          this, Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED) {
                      micPermission.launch(Manifest.permission.RECORD_AUDIO)
                      return
                  }
                  checkOverlayAndStart()
              }

              private fun checkOverlayAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      showStatus("ফ্লোটিং বোতামের জন্য Display over other apps অনুমতি দিন।")
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                      return
                  }

                  try {
                      ContextCompat.startForegroundService(
                          this,
                          Intent(this, FloatingService::class.java)
                              .setAction(FloatingService.ACTION_START)
                      )
                      showStatus("রেকর্ডিং শুরু করার অনুরোধ পাঠানো হয়েছে।")
                  } catch (e: Exception) {
                      showStatus("রেকর্ডিং শুরু করা যায়নি: ${e.message ?: "অজানা সমস্যা"}")
                  }
              }

              private fun showStatus(message: String) {
                  if (::status.isInitialized) status.text = message
              }

              private fun refreshRecordings() {
                  if (!::list.isInitialized) return
                  list.removeAllViews()

                  val collection = MediaStore.Audio.Media.EXTERNAL_CONTENT_URI
                  val projection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.DISPLAY_NAME,
                      MediaStore.Audio.Media.SIZE,
                      MediaStore.Audio.Media.DATE_ADDED
                  )
                  val selection = "${MediaStore.Audio.Media.RELATIVE_PATH} = ?"
                  val args = arrayOf("Music/CallRecorder/")
                  val sort = "${MediaStore.Audio.Media.DATE_ADDED} DESC"
                  var count = 0

                  try {
                      contentResolver.query(
                          collection, projection, selection, args, sort
                      )?.use { cursor ->
                          val idCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID)
                          val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DISPLAY_NAME)
                          val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.SIZE)

                          while (cursor.moveToNext()) {
                              count++
                              val id = cursor.getLong(idCol)
                              val name = cursor.getString(nameCol) ?: "Recording.wav"
                              val size = cursor.getLong(sizeCol)
                              val uri = ContentUris.withAppendedId(collection, id)

                              val row = LinearLayout(this).apply {
                                  orientation = LinearLayout.VERTICAL
                                  setPadding(0, 12, 0, 12)
                              }

                              row.addView(TextView(this).apply {
                                  text = "$name\n${size / 1024} KB"
                                  textSize = 15f
                              })

                              row.addView(Button(this).apply {
                                  text = "▶ প্লে করুন"
                                  setOnClickListener { playRecording(uri) }
                              })

                              list.addView(row)
                          }
                      }

                      if (count == 0) {
                          list.addView(TextView(this).apply {
                              text = "এখনো কোনো রেকর্ডিং পাওয়া যায়নি।"
                              setPadding(0, 12, 0, 12)
                          })
                      }
                  } catch (e: Exception) {
                      showStatus("রেকর্ডিং তালিকা পড়া যায়নি: ${e.message ?: "ত্রুটি"}")
                  }
              }

              private fun playRecording(uri: Uri) {
                  try {
                      player?.release()
                      player = MediaPlayer().apply {
                          setDataSource(this@MainActivity, uri)
                          setOnPreparedListener { it.start() }
                          setOnCompletionListener {
                              it.release()
                              if (player === it) player = null
                          }
                          setOnErrorListener { mp, _, _ ->
                              mp.release()
                              if (player === mp) player = null
                              showStatus("অডিও চালানো যায়নি। ফাইলটি পরীক্ষা করুন।")
                              true
                          }
                          prepareAsync()
                      }
                      showStatus("রেকর্ডিং চালু হচ্ছে…")
                  } catch (e: Exception) {
                      showStatus("প্লে করা যায়নি: ${e.message ?: "ত্রুটি"}")
                  }
              }

              override fun onDestroy() {
                  try { unregisterReceiver(receiver) } catch (_: Exception) {}
                  player?.release()
                  player = null
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/example/callrecorder/FloatingService.kt <<'EOF'
          package com.example.callrecorder

          import android.app.*
          import android.content.*
          import android.graphics.PixelFormat
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.IBinder
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import java.io.File
          import java.io.RandomAccessFile
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class FloatingService : Service() {
              companion object {
                  const val ACTION_START = "com.example.callrecorder.START"
                  const val ACTION_STOP = "com.example.callrecorder.STOP"
                  const val ACTION_STATUS = "com.example.callrecorder.STATUS"
                  const val EXTRA_MESSAGE = "message"
                  private const val CHANNEL_ID = "call_recorder_channel"
                  private const val NOTIFICATION_ID = 1201
                  private const val SAMPLE_RATE = 16000
              }

              @Volatile private var recording = false
              @Volatile private var workerError: String? = null
              private var audioRecord: AudioRecord? = null
              private var worker: Thread? = null
              private var tempFile: File? = null
              private var windowManager: WindowManager? = null
              private var floatingButton: Button? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, buildNotification())
                  showFloatingButton()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> {
                          stopRecording()
                          stopSelf()
                      }
                      ACTION_START -> startRecording()
                  }
                  return START_NOT_STICKY
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "CallRecorderPro", NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(): Notification {
                  val stopIntent = Intent(this, FloatingService::class.java).setAction(ACTION_STOP)
                  val pending = PendingIntent.getService(
                      this, 2, stopIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("CallRecorderPro")
                      .setContentText(if (recording) "রেকর্ডিং চলছে" else "রেকর্ডার প্রস্তুত")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(recording)
                      .addAction(android.R.drawable.ic_media_pause, "বন্ধ করুন", pending)
                      .build()
              }

              private fun notifyStatus(message: String) {
                  sendBroadcast(Intent(ACTION_STATUS).setPackage(packageName)
                      .putExtra(EXTRA_MESSAGE, message))
                  Toast.makeText(this, message, Toast.LENGTH_LONG).show()
              }

              private fun updateNotification() {
                  val manager = getSystemService(NotificationManager::class.java)
                  manager.notify(NOTIFICATION_ID, buildNotification())
              }

              private fun showFloatingButton() {
                  if (!android.provider.Settings.canDrawOverlays(this)) return
                  try {
                      windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                      val button = Button(this).apply {
                          text = if (recording) "STOP" else "REC"
                          textSize = 13f
                          setOnClickListener {
                              if (recording) stopRecording() else startRecording()
                          }
                      }
                      floatingButton = button
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          if (Build.VERSION.SDK_INT >= 26)
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          else @Suppress("DEPRECATION")
                              WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      )
                      params.gravity = Gravity.TOP or Gravity.END
                      params.x = 20
                      params.y = 220
                      windowManager?.addView(button, params)
                  } catch (e: Exception) {
                      notifyStatus("ফ্লোটিং বোতাম দেখানো যায়নি: ${e.message ?: "ত্রুটি"}")
                  }
              }

              private fun updateFloatingButton() {
                  floatingButton?.text = if (recording) "STOP" else "REC"
                  updateNotification()
              }

              private fun startRecording() {
                  if (recording) {
                      notifyStatus("রেকর্ডিং ইতিমধ্যে চলছে।")
                      return
                  }

                  if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) !=
                      android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      notifyStatus("মাইক্রোফোন অনুমতি দেওয়া হয়নি।")
                      return
                  }

                  val minBuffer = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (minBuffer <= 0) {
                      notifyStatus("অডিও রেকর্ডার চালু করা যায়নি।")
                      return
                  }

                  var recorder: AudioRecord? = null
                  try {
                      recorder = AudioRecord(
                          MediaRecorder.AudioSource.MIC,
                          SAMPLE_RATE,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          maxOf(minBuffer, 4096)
                      )
                      if (recorder.state != AudioRecord.STATE_INITIALIZED) {
                          recorder.release()
                          notifyStatus("মাইক্রোফোন চালু করা যায়নি।")
                          return
                      }

                      val file = File(cacheDir, "recording_temp.wav")
                      RandomAccessFile(file, "rw").use {
                          it.setLength(0)
                          it.write(ByteArray(44))
                      }

                      recorder.startRecording()
                      if (recorder.recordingState != AudioRecord.RECORDSTATE_RECORDING) {
                          recorder.release()
                          notifyStatus("রেকর্ডিং শুরু হয়নি।")
                          return
                      }

                      audioRecord = recorder
                      tempFile = file
                      workerError = null
                      recording = true
                      updateFloatingButton()
                      notifyStatus("রেকর্ডিং চলছে। বন্ধ করলে Music/CallRecorder-এ সেভ হবে।")

                      val activeRecorder = recorder
                      worker = Thread {
                          try {
                              RandomAccessFile(file, "rw").use { raf ->
                                  raf.seek(44)
                                  val buffer = ByteArray(4096)
                                  while (recording) {
                                      val n = activeRecorder.read(
                                          buffer, 0, buffer.size
                                      )
                                      if (n > 0) {
                                          val evenBytes = n - (n % 2)
                                          if (evenBytes > 0) raf.write(buffer, 0, evenBytes)
                                      } else if (n < 0 && recording) {
                                          workerError = "মাইক্রোফোন থেকে অডিও পড়া যায়নি (কোড $n)।"
                                          recording = false
                                      }
                                  }
                                  val pcmSize = (raf.length() - 44).coerceAtLeast(0)
                                  writeWavHeader(raf, pcmSize)
                              }
                          } catch (e: Exception) {
                              if (recording) workerError =
                                  "রেকর্ডিং লেখার সমস্যা: ${e.message ?: "অজানা ত্রুটি"}"
                              recording = false
                          }
                      }.apply { name = "CallRecorderAudioWorker"; start() }
                  } catch (e: Exception) {
                      recording = false
                      try { recorder?.release() } catch (_: Exception) {}
                      audioRecord = null
                      updateFloatingButton()
                      notifyStatus("রেকর্ডিং শুরু করা যায়নি: ${e.message ?: "ত্রুটি"}")
                  }
              }

              private fun stopRecording() {
                  if (!recording && worker == null) {
                      notifyStatus("কোনো রেকর্ডিং চলছে না।")
                      return
                  }

                  recording = false
                  try { audioRecord?.stop() } catch (_: Exception) {}
                  try { worker?.join(5000) } catch (_: InterruptedException) {
                      Thread.currentThread().interrupt()
                  }

                  if (worker?.isAlive == true) {
                      worker?.interrupt()
                      cleanupRecorder()
                      updateFloatingButton()
                      notifyStatus("রেকর্ডিং বন্ধ হয়েছে, কিন্তু ফাইল সম্পূর্ণ সেভ হয়নি। আবার চেষ্টা করুন।")
                      return
                  }

                  cleanupRecorder()
                  updateFloatingButton()

                  val error = workerError
                  val file = tempFile
                  worker = null
                  tempFile = null

                  if (error != null) {
                      file?.delete()
                      notifyStatus("সেভ ব্যর্থ: $error")
                      return
                  }

                  if (file == null || !file.exists() || file.length() <= 44) {
                      file?.delete()
                      notifyStatus("কোনো অডিও পাওয়া যায়নি। ফাইল সেভ করা হয়নি।")
                      return
                  }

                  try {
                      saveToPublicMusic(file)
                      file.delete()
                      notifyStatus("রেকর্ডিং সফলভাবে Music/CallRecorder ফোল্ডারে সেভ হয়েছে।")
                  } catch (e: Exception) {
                      notifyStatus("সেভ ব্যর্থ: ${e.message ?: "স্টোরেজ সমস্যা"}। ফাইলটি অ্যাপে অস্থায়ীভাবে থাকতে পারে।")
                  }
              }

              private fun cleanupRecorder() {
                  try { audioRecord?.release() } catch (_: Exception) {}
                  audioRecord = null
              }

              private fun saveToPublicMusic(file: File) {
                  val stamp = SimpleDateFormat(
                      "yyyyMMdd_HHmmss", Locale.US
                  ).format(Date())
                  val values = android.content.ContentValues().apply {
                      put(MediaStore.Audio.Media.DISPLAY_NAME, "Recording_$stamp.wav")
                      put(MediaStore.Audio.Media.MIME_TYPE, "audio/wav")
                      put(
                          MediaStore.Audio.Media.RELATIVE_PATH,
                          Environment.DIRECTORY_MUSIC + "/CallRecorder/"
                      )
                      put(MediaStore.Audio.Media.IS_PENDING, 1)
                  }

                  val uri: Uri = contentResolver.insert(
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI, values
                  ) ?: throw IllegalStateException("স্টোরেজে ফাইল তৈরি করা যায়নি")

                  try {
                      contentResolver.openOutputStream(uri, "w").use { output ->
                          if (output == null) {
                              throw IllegalStateException("ফাইল লেখার অনুমতি পাওয়া যায়নি")
                          }
                          file.inputStream().use { input -> input.copyTo(output) }
                          output.flush()
                      }

                      val expectedSize = file.length()
                      val actualSize = contentResolver.openFileDescriptor(uri, "r").use {
                          it?.statSize ?: -1L
                      }
                      if (actualSize >= 0 && actualSize != expectedSize) {
                          throw IllegalStateException("সেভ করা ফাইলের আকার মিলছে না")
                      }

                      val completed = android.content.ContentValues().apply {
                          put(MediaStore.Audio.Media.IS_PENDING, 0)
                      }
                      contentResolver.update(uri, completed, null, null)
                  } catch (e: Exception) {
                      try { contentResolver.delete(uri, null, null) } catch (_: Exception) {}
                      throw e
                  }
              }

              private fun writeWavHeader(file: RandomAccessFile, pcmSize: Long) {
                  val dataSize = pcmSize.coerceAtMost(0x7FFFFFFFL).toInt()
                  val byteRate = SAMPLE_RATE * 1 * 16 / 8
                  file.seek(0)
                  file.writeBytes("RIFF")
                  writeIntLE(file, 36 + dataSize)
                  file.writeBytes("WAVE")
                  file.writeBytes("fmt ")
                  writeIntLE(file, 16)
                  writeShortLE(file, 1)
                  writeShortLE(file, 1)
                  writeIntLE(file, SAMPLE_RATE)
                  writeIntLE(file, byteRate)
                  writeShortLE(file, 2)
                  writeShortLE(file, 16)
                  file.writeBytes("data")
                  writeIntLE(file, dataSize)
              }

              private fun writeIntLE(file: RandomAccessFile, value: Int) {
                  file.write(value and 0xff)
                  file.write((value shr 8) and 0xff)
                  file.write((value shr 16) and 0xff)
                  file.write((value shr 24) and 0xff)
              }

              private fun writeShortLE(file: RandomAccessFile, value: Int) {
                  file.write(value and 0xff)
                  file.write((value shr 8) and 0xff)
              }

              override fun onDestroy() {
                  if (recording || worker != null) stopRecording()
                  try {
                      floatingButton?.let { windowManager?.removeView(it) }
                  } catch (_: Exception) {}
                  floatingButton = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
