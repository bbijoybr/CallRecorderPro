
name: Build CallRecorderPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/example/callrecorder
          mkdir -p app/src/main/res/values

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CallRecorderPro"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.callrecorder"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.callrecorder"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#1769AA</item>
                  <item name="android:statusBarColor">#124B7A</item>
                  <item name="android:navigationBarColor">#124B7A</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="false"
                  android:label="CallRecorderPro"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/callrecorder/MainActivity.kt <<'EOF'
          package com.example.callrecorder

          import android.Manifest
          import android.content.BroadcastReceiver
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.media.MediaPlayer
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat

          class MainActivity : ComponentActivity() {

              private lateinit var status: TextView
              private lateinit var recordingList: LinearLayout
              private var player: MediaPlayer? = null

              private val micPermission =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted) {
                          checkOverlayAndStart()
                      } else {
                          showStatus("Microphone permission was denied.")
                      }
                  }

              private val statusReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      val message = intent?.getStringExtra(
                          FloatingService.EXTRA_MESSAGE
                      )
                      if (!message.isNullOrBlank()) {
                          showStatus(message)
                      }
                      refreshRecordings()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(22, 22, 22, 22)
                  }

                  root.addView(TextView(this).apply {
                      text = "CallRecorderPro"
                      textSize = 26f
                      gravity = Gravity.CENTER
                  })

                  status = TextView(this).apply {
                      text = "Ready to record"
                      textSize = 16f
                      setPadding(0, 18, 0, 18)
                  }
                  root.addView(status)

                  root.addView(Button(this).apply {
                      text = "Start Recording"
                      setOnClickListener {
                          requestPermissionsAndStart()
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Stop Recording"
                      setOnClickListener {
                          startService(
                              Intent(
                                  this@MainActivity,
                                  FloatingService::class.java
                              ).setAction(FloatingService.ACTION_STOP)
                          )
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Refresh Recordings"
                      setOnClickListener { refreshRecordings() }
                  })

                  root.addView(TextView(this).apply {
                      text = "Saved Recordings"
                      textSize = 20f
                      setPadding(0, 20, 0, 10)
                  })

                  val scroll = ScrollView(this)
                  recordingList = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  scroll.addView(recordingList)

                  root.addView(
                      scroll,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                  )

                  setContentView(root)

                  val filter = IntentFilter(FloatingService.ACTION_STATUS)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(
                          statusReceiver,
                          filter,
                          Context.RECEIVER_NOT_EXPORTED
                      )
                  } else {
                      @Suppress("DEPRECATION")
                      registerReceiver(statusReceiver, filter)
                  }

                  refreshRecordings()
              }

              private fun requestPermissionsAndStart() {
                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      micPermission.launch(Manifest.permission.RECORD_AUDIO)
                      return
                  }

                  checkOverlayAndStart()
              }

              private fun checkOverlayAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      showStatus(
                          "Allow Display over other apps, then return and tap Start."
                      )
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                      return
                  }

                  try {
                      ContextCompat.startForegroundService(
                          this,
                          Intent(this, FloatingService::class.java)
                              .setAction(FloatingService.ACTION_START)
                      )
                      showStatus("Starting recorder...")
                  } catch (e: Exception) {
                      showStatus(
                          "Could not start: ${e.message ?: "Unknown error"}"
                      )
                  }
              }

              private fun showStatus(message: String) {
                  if (::status.isInitialized) {
                      status.text = message
                  }
              }

              private fun refreshRecordings() {
                  if (!::recordingList.isInitialized) return

                  recordingList.removeAllViews()
                  var count = 0

                  val collection =
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI

                  val projection = arrayOf(
                      MediaStore.Audio.Media._ID,
                      MediaStore.Audio.Media.DISPLAY_NAME,
                      MediaStore.Audio.Media.SIZE
                  )

                  val selection =
                      "${MediaStore.Audio.Media.RELATIVE_PATH} = ?"
                  val selectionArgs = arrayOf("Music/CallRecorder/")
                  val sortOrder =
                      "${MediaStore.Audio.Media.DATE_ADDED} DESC"

                  try {
                      contentResolver.query(
                          collection,
                          projection,
                          selection,
                          selectionArgs,
                          sortOrder
                      )?.use { cursor ->

                          val idIndex = cursor.getColumnIndexOrThrow(
                              MediaStore.Audio.Media._ID
                          )
                          val nameIndex = cursor.getColumnIndexOrThrow(
                              MediaStore.Audio.Media.DISPLAY_NAME
                          )
                          val sizeIndex = cursor.getColumnIndexOrThrow(
                              MediaStore.Audio.Media.SIZE
                          )

                          while (cursor.moveToNext()) {
                              count++

                              val id = cursor.getLong(idIndex)
                              val name = cursor.getString(nameIndex)
                                  ?: "Recording.wav"
                              val size = cursor.getLong(sizeIndex)

                              val uri = ContentUris.withAppendedId(
                                  collection,
                                  id
                              )

                              val row = LinearLayout(this).apply {
                                  orientation = LinearLayout.VERTICAL
                                  setPadding(0, 10, 0, 10)
                              }

                              row.addView(TextView(this).apply {
                                  text = "$name\n${size / 1024} KB"
                                  textSize = 15f
                              })

                              row.addView(Button(this).apply {
                                  text = "Play"
                                  setOnClickListener {
                                      playRecording(uri)
                                  }
                              })

                              recordingList.addView(row)
                          }
                      }

                      if (count == 0) {
                          recordingList.addView(TextView(this).apply {
                              text = "No recordings found yet."
                              setPadding(0, 12, 0, 12)
                          })
                      }
                  } catch (e: Exception) {
                      showStatus(
                          "Could not load recordings: ${e.message ?: "Error"}"
                      )
                  }
              }

              private fun playRecording(uri: Uri) {
                  try {
                      player?.release()
                      player = MediaPlayer().apply {
                          setDataSource(this@MainActivity, uri)

                          setOnPreparedListener { mp ->
                              mp.start()
                              showStatus("Playing recording...")
                          }

                          setOnCompletionListener { mp ->
                              mp.release()
                              if (player === mp) player = null
                              showStatus("Playback finished.")
                          }

                          setOnErrorListener { mp, _, _ ->
                              mp.release()
                              if (player === mp) player = null
                              showStatus("Could not play this audio file.")
                              true
                          }

                          prepareAsync()
                      }
                  } catch (e: Exception) {
                      showStatus(
                          "Playback failed: ${e.message ?: "Unknown error"}"
                      )
                  }
              }

              override fun onDestroy() {
                  try {
                      unregisterReceiver(statusReceiver)
                  } catch (_: Exception) {
                  }

                  player?.release()
                  player = null
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/example/callrecorder/FloatingService.kt <<'EOF'
          package com.example.callrecorder

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.PixelFormat
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.IBinder
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.Toast
          import androidx.core.app.NotificationCompat
          import java.io.File
          import java.io.RandomAccessFile
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class FloatingService : Service() {

              companion object {
                  const val ACTION_START =
                      "com.example.callrecorder.START"
                  const val ACTION_STOP =
                      "com.example.callrecorder.STOP"
                  const val ACTION_STATUS =
                      "com.example.callrecorder.STATUS"
                  const val EXTRA_MESSAGE = "message"

                  private const val CHANNEL_ID = "call_recorder_channel"
                  private const val NOTIFICATION_ID = 1201
                  private const val SAMPLE_RATE = 16000
              }

              @Volatile
              private var recording = false

              @Volatile
              private var workerError: String? = null

              private var audioRecord: AudioRecord? = null
              private var worker: Thread? = null
              private var tempFile: File? = null
              private var windowManager: WindowManager? = null
              private var floatingButton: Button? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
                  startForeground(NOTIFICATION_ID, buildNotification())
                  showFloatingButton()
              }

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {
                  when (intent?.action) {
                      ACTION_START -> startRecording()
                      ACTION_STOP -> {
                          stopRecording()
                          stopSelf()
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "CallRecorderPro",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }
              }

              private fun buildNotification(): Notification {
                  val stopIntent = Intent(
                      this,
                      FloatingService::class.java
                  ).setAction(ACTION_STOP)

                  val pendingIntent = PendingIntent.getService(
                      this,
                      2,
                      stopIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or
                          PendingIntent.FLAG_IMMUTABLE
                  )

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("CallRecorderPro")
                      .setContentText(
                          if (recording) "Recording in progress"
                          else "Recorder ready"
                      )
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setOngoing(recording)
                      .addAction(
                          android.R.drawable.ic_media_pause,
                          "Stop",
                          pendingIntent
                      )
                      .build()
              }

              private fun updateNotification() {
                  getSystemService(NotificationManager::class.java)
                      .notify(NOTIFICATION_ID, buildNotification())
              }

              private fun notifyStatus(message: String) {
                  sendBroadcast(
                      Intent(ACTION_STATUS)
                          .setPackage(packageName)
                          .putExtra(EXTRA_MESSAGE, message)
                  )
                  Toast.makeText(
                      this,
                      message,
                      Toast.LENGTH_LONG
                  ).show()
              }

              private fun showFloatingButton() {
                  if (!Settings.canDrawOverlays(this)) return

                  try {
                      windowManager =
                          getSystemService(WINDOW_SERVICE) as WindowManager

                      val button = Button(this).apply {
                          text = "REC"
                          textSize = 13f
                          setOnClickListener {
                              if (recording) stopRecording()
                              else startRecording()
                          }
                      }

                      floatingButton = button

                      val windowType =
                          if (Build.VERSION.SDK_INT >= 26) {
                              WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                          } else {
                              @Suppress("DEPRECATION")
                              WindowManager.LayoutParams.TYPE_PHONE
                          }

                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          WindowManager.LayoutParams.WRAP_CONTENT,
                          windowType,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      )

                      params.gravity = Gravity.TOP or Gravity.END
                      params.x = 20
                      params.y = 220

                      windowManager?.addView(button, params)
                  } catch (e: Exception) {
                      notifyStatus(
                          "Floating button error: ${e.message ?: "Unknown error"}"
                      )
                  }
              }

              private fun updateFloatingButton() {
                  floatingButton?.text = if (recording) "STOP" else "REC"
                  updateNotification()
              }

              private fun startRecording() {
                  if (recording || worker?.isAlive == true) {
                      notifyStatus("Recording is already running.")
                      return
                  }

                  if (
                      checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) !=
                      PackageManager.PERMISSION_GRANTED
                  ) {
                      notifyStatus("Microphone permission is required.")
                      return
                  }

                  val minBuffer = AudioRecord.getMinBufferSize(
                      SAMPLE_RATE,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )

                  if (minBuffer <= 0) {
                      notifyStatus("Could not initialize audio recording.")
                      return
                  }

                  var recorder: AudioRecord? = null

                  try {
                      recorder = AudioRecord(
                          MediaRecorder.AudioSource.MIC,
                          SAMPLE_RATE,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT,
                          maxOf(minBuffer, 4096)
                      )

                      if (recorder.state != AudioRecord.STATE_INITIALIZED) {
                          recorder.release()
                          notifyStatus("Microphone initialization failed.")
                          return
                      }

                      val file = File(
                          cacheDir,
                          "recording_${System.currentTimeMillis()}.wav"
                      )

                      RandomAccessFile(file, "rw").use {
                          it.setLength(0)
                          it.write(ByteArray(44))
                      }

                      recorder.startRecording()

                      if (
                          recorder.recordingState !=
                          AudioRecord.RECORDSTATE_RECORDING
                      ) {
                          recorder.release()
                          notifyStatus("Recording did not start.")
                          return
                      }

                      audioRecord = recorder
                      tempFile = file
                      workerError = null
                      recording = true
                      updateFloatingButton()

                      notifyStatus(
                          "Recording started. Press STOP to save the WAV file."
                      )

                      val activeRecorder = recorder

                      worker = Thread {
                          try {
                              RandomAccessFile(file, "rw").use { raf ->
                                  raf.seek(44)
                                  val buffer = ByteArray(4096)

                                  while (recording) {
                                      val bytesRead = activeRecorder.read(
                                          buffer,
                                          0,
                                          buffer.size
                                      )

                                      if (bytesRead > 0) {
                                          val evenBytes =
                                              bytesRead - (bytesRead % 2)

                                          if (evenBytes > 0) {
                                              raf.write(
                                                  buffer,
                                                  0,
                                                  evenBytes
                                              )
                                          }
                                      } else if (bytesRead < 0 && recording) {
                                          workerError =
                                              "Microphone read failed: $bytesRead"
                                          recording = false
                                      }
                                  }

                                  val pcmSize =
                                      (raf.length() - 44).coerceAtLeast(0)

                                  writeWavHeader(raf, pcmSize)
                              }
                          } catch (e: Exception) {
                              if (recording) {
                                  workerError =
                                      "Audio write failed: ${e.message ?: "Unknown error"}"
                              }
                              recording = false
                          }
                      }.apply {
                          name = "CallRecorderAudioWorker"
                          start()
                      }
                  } catch (e: Exception) {
                      recording = false
                      try {
                          recorder?.release()
                      } catch (_: Exception) {
                      }
                      audioRecord = null
                      updateFloatingButton()
                      notifyStatus(
                          "Could not start recording: ${e.message ?: "Unknown error"}"
                      )
                  }
              }

              private fun stopRecording() {
                  if (!recording && worker == null) {
                      notifyStatus("No recording is running.")
                      return
                  }

                  recording = false

                  try {
                      audioRecord?.stop()
                  } catch (_: Exception) {
                  }

                  try {
                      worker?.join(5000)
                  } catch (_: InterruptedException) {
                      Thread.currentThread().interrupt()
                  }

                  if (worker?.isAlive == true) {
                      worker?.interrupt()
                      cleanupRecorder()
                      worker = null
                      updateFloatingButton()
                      notifyStatus(
                          "Save failed: the audio worker did not stop in time."
                      )
                      return
                  }

                  cleanupRecorder()
                  updateFloatingButton()

                  val error = workerError
                  val file = tempFile

                  worker = null
                  tempFile = null

                  if (error != null) {
                      file?.delete()
                      notifyStatus("Save failed: $error")
                      return
                  }

                  if (
                      file == null ||
                      !file.exists() ||
                      file.length() <= 44
                  ) {
                      file?.delete()
                      notifyStatus(
                          "No audio data was recorded. Nothing was saved."
                      )
                      return
                  }

                  try {
                      saveToPublicMusic(file)
                      file.delete()
                      notifyStatus(
                          "Saved successfully to Music/CallRecorder."
                      )
                  } catch (e: Exception) {
                      notifyStatus(
                          "Save failed: ${e.message ?: "Storage error"}. " +
                              "The temporary recording may remain in app storage."
                      )
                  }
              }

              private fun cleanupRecorder() {
                  try {
                      audioRecord?.release()
                  } catch (_: Exception) {
                  }
                  audioRecord = null
              }

              private fun saveToPublicMusic(file: File) {
                  val timestamp = SimpleDateFormat(
                      "yyyyMMdd_HHmmss",
                      Locale.US
                  ).format(Date())

                  val values = ContentValues().apply {
                      put(
                          MediaStore.Audio.Media.DISPLAY_NAME,
                          "Recording_$timestamp.wav"
                      )
                      put(MediaStore.Audio.Media.MIME_TYPE, "audio/wav")
                      put(
                          MediaStore.Audio.Media.RELATIVE_PATH,
                          Environment.DIRECTORY_MUSIC + "/CallRecorder/"
                      )
                      put(MediaStore.Audio.Media.IS_PENDING, 1)
                  }

                  val uri: Uri = contentResolver.insert(
                      MediaStore.Audio.Media.EXTERNAL_CONTENT_URI,
                      values
                  ) ?: throw IllegalStateException(
                      "Android could not create the output file."
                  )

                  try {
                      val output = contentResolver.openOutputStream(uri, "w")
                          ?: throw IllegalStateException(
                              "Could not open the output file."
                          )

                      output.use { out ->
                          file.inputStream().use { input ->
                              input.copyTo(out)
                          }
                          out.flush()
                      }

                      val expectedSize = file.length()
                      val actualSize =
                          contentResolver.openFileDescriptor(uri, "r").use {
                              it?.statSize ?: -1L
                          }

                      if (
                          actualSize >= 0 &&
                          actualSize != expectedSize
                      ) {
                          throw IllegalStateException(
                              "Saved file size does not match."
                          )
                      }

                      val completed = ContentValues().apply {
                          put(MediaStore.Audio.Media.IS_PENDING, 0)
                      }

                      val updated = contentResolver.update(
                          uri,
                          completed,
                          null,
                          null
                      )

                      if (updated <= 0) {
                          throw IllegalStateException(
                              "Could not finalize the saved file."
                          )
                      }
                  } catch (e: Exception) {
                      try {
                          contentResolver.delete(uri, null, null)
                      } catch (_: Exception) {
                      }
                      throw e
                  }
              }

              private fun writeWavHeader(
                  file: RandomAccessFile,
                  pcmSize: Long
              ) {
                  val dataSize =
                      pcmSize.coerceAtMost(0x7FFFFFFFL).toInt()

                  file.seek(0)
                  file.writeBytes("RIFF")
                  writeIntLE(file, 36 + dataSize)
                  file.writeBytes("WAVE")
                  file.writeBytes("fmt ")
                  writeIntLE(file, 16)
                  writeShortLE(file, 1)
                  writeShortLE(file, 1)
                  writeIntLE(file, SAMPLE_RATE)
                  writeIntLE(file, SAMPLE_RATE * 2)
                  writeShortLE(file, 2)
                  writeShortLE(file, 16)
                  file.writeBytes("data")
                  writeIntLE(file, dataSize)
              }

              private fun writeIntLE(
                  file: RandomAccessFile,
                  value: Int
              ) {
                  file.write(value and 0xff)
                  file.write((value shr 8) and 0xff)
                  file.write((value shr 16) and 0xff)
                  file.write((value shr 24) and 0xff)
              }

              private fun writeShortLE(
                  file: RandomAccessFile,
                  value: Int
              ) {
                  file.write(value and 0xff)
                  file.write((value shr 8) and 0xff)
              }

              override fun onDestroy() {
                  if (recording || worker != null) {
                      stopRecording()
                  }

                  try {
                      floatingButton?.let {
                          windowManager?.removeView(it)
                      }
                  } catch (_: Exception) {
                  }

                  floatingButton = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
